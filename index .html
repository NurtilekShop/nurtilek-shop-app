  if(g.id==='tg')h+=`<div class="card adm"><div class="thumb" style="${bgi('tgstar')}" id="tu">${IM.tgstar?'':'📷'}</div><div style="flex:1"><b>Иконка Telegram Stars</b><div class="sub" style="margin:0">Круглая картинка на странице Stars</div></div>${IM.tgstar?'<button class="ghost" id="td" style="color:var(--bad);border-color:var(--bad)">🗑</button>':''}</div>`;
  h+=Object.entries(g.items).filter(([k,l])=>l.length).map(([k,l])=>`<div class="sub" style="letter-spacing:1px;text-transform:uppercase;color:var(--gold)">${k}</div>`+l.map((p,i)=>{const key=pk(g,p);return `<div class="card adm"><div class="thumb" style="${bgi(key)}" data-u="${key}">${IM[key]?'':'📷'}</div><div style="flex:1"><b>${p[0]}</b>${IM[key]?`<div><button data-x="${key}" style="background:none;border:0;color:var(--bad);padding:2px 0;font:12px var(--sans);cursor:pointer">🗑 убрать фото</button></div>`:'<div class="sub" style="margin:0;font-size:12px">Нажмите на квадрат — загрузить фото</div>'}</div><input type="number" value="${p[1]}" inputmode="numeric" style="width:84px;text-align:right" data-k="${k}" data-i="${i}" aria-label="Цена"></div>`}).join('')).join('')}
 V.innerHTML=h;
 const re=()=>admV();
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{admGame=G.find(g=>g.id===b.dataset.a);admV()});
 const q=(s,f)=>{const e=$(s);if(e)e.onclick=f};
 q('#ab',()=>{admGame=null;admV()});q('#avup',()=>pick('avatar',re));
 if(admGame){const g=admGame;q('#cu',()=>pick('c:'+g.id,re));q('#cd',()=>delImg('c:'+g.id,re));q('#tu',()=>pick('tgstar',re));q('#td',()=>delImg('tgstar',re))}
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(b.dataset.u,re));
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>delImg(b.dataset.x,re));
 document.querySelectorAll('[data-k]').forEach(inp=>inp.onchange=()=>{const v=+inp.value;if(v>0){admGame.items[inp.dataset.k][inp.dataset.i][1]=v;toast('Цена сохранена (демо)')}})}
function render(){nav();
 if(tab==='home')home();else if(tab==='ord')ordersV();else if(tab==='rev')revV();else if(tab==='prof')profV();else if(tab==='adm')admV();
 V.scrollTop=0}
render();
</script></body></html>
